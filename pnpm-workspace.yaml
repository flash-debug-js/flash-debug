minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@flash-tunnel/adapter-cloudflare'
  - '@flash-tunnel/config'
  - '@flash-tunnel/core'
  - '@flash-tunnel/types'
  - '@flash-tunnel/utils'
  - '@flash-nexus/config'
  - '@flash-nexus/core'
  - '@flash-nexus/sdk'
  - '@flash-nexus/types'

trustPolicy: no-downgrade
shellEmulator: true

packages:
  - packages/*

allowBuilds:
  esbuild: true
